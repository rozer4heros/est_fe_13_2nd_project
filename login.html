<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/login_signup.css" />
    <title>로그인 | ROUNZ</title>
  </head>
  <body>
    <main>
      <section class="wrap login-container">
        <!-- 로그인 창 헤더-->
        <div class="login-signup-header">
          <p class="logo-sub body_cap">세상에 없던 안경 쇼핑</p>
          <h1 class="logo">rounz</h1>
        </div>

        <div class="input-field">
          <form class="form-group">
            <div class="input-group">
              <input type="email" id="useremail" required placeholder=" " />
              <label for="useremail" class="floating_label body_m">Email address*</label>
            </div>

            <div class="input-group">
              <input type="password" id="userpw" required placeholder=" " minlength="8" maxlength="16" />
              <label for="userpw" class="floating_label body_m">Password*</label>
              <span class="material-icons-outlined visibility-icon" aria-hidden="true">visibility</span>
            </div>
            <button class="submit-button body_m">continue</button>
          </form>
        </div>

        <div>
          <div class="notice-line d-flex">
            <span class="notice-line-text body_cap">아직 회원이 아니신가요?</span>
            <a href="#signup.html" class="notice-line-link body_cap">회원가입하기</a>
          </div>

          <div class="divider-text body_cap d-flex">or</div>
        </div>

        <ul class="social_button_list d-flex">
          <li>
            <a href="#" class="social_kakao">
              <img src="image/social_icon/Button_Kakao_Login.png" alt="카카오로 로그인하기" />
            </a>
          </li>
          <li>
            <a href="#" class="social_naver">
              <img src="image/social_icon/Button_Naver_Login.png" alt="네이버로 로그인하기" />
            </a>
          </li>
          <li>
            <a href="#" class="social_google">
              <img src="image/social_icon/Button_Google_Login.png" alt="구글로 로그인하기" />
            </a>
          </li>
          <li>
            <a href="#" class="social_apple">
              <img src="image/social_icon/Button_Apple_Login.png" alt="애플로 로그인하기" />
            </a>
          </li>
        </ul>

        <div class="find-account">
          <a href="#">아이디 찾기</a>
          <a href="#">비밀번호 찾기</a>
        </div>
      </section>
    </main>
  </body>
</html>
