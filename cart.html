<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/cart.css" />
    <title>장바구니 | ROUNZ</title>
  </head>
  <body>
    <header></header>

    <div class="nav_drawer_wrap drawer_wrap below_pc">
      <!-- JS로 넣을 예정 -->
      <!-- components.html 참고 -->
    </div>

    <main class="cart_page_main">
      <h1 class="sr_only">장바구니 페이지 입니다.</h1>
      <div class="wrap cart_layout_container"></div>
      <div class="best_picks">
        <div class="best_picks_wrap">
          <div class="best_picks_header">
            <h2 class="best_picks_title display_h2">추천 상품</h2>
            <p class="best_picks_subtitle body_m">함께 보면 좋은 상품</p>
          </div>

          <div class="best_picks_slider_window">
            <ul class="best_picks_slider_track" id="bestPicksContainer" aria-label="추천 상품 슬라이드 목록">
              <li class="best_picks_page" id="bestPicksPage1"></li>
              <li class="best_picks_page" id="bestPicksPage2"></li>
            </ul>
          </div>

          <div class="best_picks_indicator_track" id="bestPicksIndicatorTrack">
            <div class="best_picks_indicator_bar" id="bestPicksIndicatorBar"></div>
          </div>
        </div>
      </div>
    </main>

    <footer></footer>

    <script type="module" src="js/common.js"></script>
    <script type="module" src="js/cart.js"></script>
  </body>
</html>
