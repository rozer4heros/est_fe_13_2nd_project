<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Round|Material+Symbols+Rounded"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/cart.css" />
    <title>장바구니 | ROUNZ</title>
  </head>
  <body>
    <header></header>
    <div class="nav_drawer_wrap drawer_wrap below_pc">
      <!-- JS로 넣을 예정 -->
      <!-- components.html 참고 -->
    </div>
    <main class="cart_wrapper">
      <h2 class="cart_title display_h2">장바구니</h2>
      <div class="cart_container d-flex">
        <section class="cart_left">
          <div class="cart_controls d-flex justify-content-between align-items-center">
            <label class="checkbox_label d-flex align-items-center">
              <input type="checkbox" id="select_all" checked />
              <span class="checkbox_custom body_l"></span>
              전체선택
            </label>
            <div class="control_buttons d-flex align-items-center body_m">
              <button type="button" class="btn_control" id="btn_delete_selected">선택삭제</button>
              <span class="control_divider">|</span>
              <button type="button" class="btn_control" id="btn_clear_cart">장바구니 비우기</button>
            </div>
          </div>

          <ul class="cart_list" id="cart_items_container"></ul>
        </section>

        <aside class="cart_right">
          <div class="summary_box">
            <h3 class="summary_title body_l">결제 정보</h3>
            <div class="summary_row d-flex justify-content-between">
              <span class="body_cap">총 상품금액</span>
              <span id="total_product_price" class="body_m">0원</span>
            </div>
            <div class="summary_row d-flex justify-content-between">
              <span class="body_cap">배송비</span>
              <span id="delivery_fee" class="body_m">0원</span>
            </div>
            <div class="summary_row d-flex justify-content-between">
              <span class="body_cap">할인금액</span>
              <span id="total_discount" class="text_red body_m">0원</span>
            </div>
            <hr class="summary_divider" />
            <div class="summary_total d-flex justify-content-between align-items-center">
              <span class="body_l">결제 예정금액</span>
              <span id="final_payment_price" class="total_price body_xl">0원</span>
            </div>
            <button type="button" class="submit-button btn_order body_xl" id="btn_submit_order">주문하기</button>
          </div>
        </aside>
      </div>

      <section class="best_picks">
        <h3 class="section_title display_h2">추천 상품</h3>
        <ul class="product_grid" id="recommend_products_container"></ul>
      </section>
    </main>
    <footer></footer>
    <script type="module" src="./js/main.js"></script>
    <script src="js/cart.js"></script>
  </body>
</html>
